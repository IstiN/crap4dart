# crap4dart self-configuration (dogfooding).
# This repository is a pure Dart package, so Flutter-specific gates
# (golden, accessibility, hardcoded_strings) are disabled.
sources: [lib, bin, test]

crap:
  enabled: true
  threshold: 8.0

coverage:
  lcov_path: coverage/lcov.info
  run_tests: false
  required: false
  branch_coverage: true

gates:
  loc:
    enabled: true
    max_lines: 800
    exclude:
      - '**.g.dart'
      - '**.freezed.dart'
      - '**.mocks.dart'
  test_coverage:
    enabled: true
    min_percent: 70.0
    per_file: false
  golden:
    enabled: false
  hardcoded_strings:
    enabled: false
  accessibility:
    enabled: false
  complexity:
    enabled: true
    max_complexity: 12
  # Wave-6 type-surface gates, split by concern: inline record types
  # must move to named typedefs, record fields must be named (no .$N),
  # and record arity is capped (bigger records become classes).
  # Warning severity; dogfooding cleanup accompanies the enablement.
  inline_record_types:
    enabled: true
    severity: warning
  record_named_fields:
    enabled: true
    severity: warning
  record_size:
    enabled: true
    severity: warning
    max_fields: 5
  method_size:
    enabled: true
    max_lines: 80
    max_params: 8
    # Dogfooding `entries`: config aggregate/flag classes legitimately
    # need more params than a method — GatesConfig aggregates 28 gate
    # configs (one param each), SimilarityGateConfig carries the flag
    # triplet + 6 similarity keys, ScatteredConstantsGateConfig adds
    # the deep-search knobs.
    entries:
      - max_params: 28
        paths:
          - 'lib/src/config/config.dart'
          - 'lib/src/config/similarity_gate_config.dart'
      - max_params: 10
        paths:
          - 'lib/src/config/gate_configs.dart'
          - 'lib/src/config/gate_configs_scattered.dart'
  public_docs:
    enabled: true
    exclude:
      - 'test/**'
  # Wave-7 cross-file aggregation: one business fact hardcoded in N
  # files (the "change 86400 in every service" hazard) is invisible to
  # the in-file magic_constants gate. Flags one violation per
  # occurrence; the fix is a shared constant — verify the occurrences
  # really mean the same thing first.
  # Cross-file literal scatter (word + prefix heads). ignore: plain
  # words silence the value, entries with a slash exempt files
  # (fast-moving or special domains where extraction is not wanted).
  scattered_constants:
    enabled: true
    severity: warning
    min_files: 3
    exclude:
      - '**.g.dart'
      - '**.freezed.dart'
      - '**.mocks.dart'
      - 'test/**'
    # The two shared help texts below are declared exactly once (the
    # kOutputFormatHelp / kDiffBaseHelp initializers in constants.dart),
    # but dart format wraps the initializer onto the line after the
    # declaration name — the gate's declaration-site exemption compares
    # the declaration's line to the literal's line, misses its own
    # const, and reports it as a duplicate of itself. Exempt the exact
    # values; no other occurrence of either string exists in the code.
    ignore:
      - 'Output format (json writes only JSON to stdout).'
      - 'Like --diff, but diffs against the given git ref.'
  # File-level near-duplicate detection (crap4dart >=0.15.0): docs
  # corpora rot through copy-paste; this catches new near-copies.
  # Measured on this repo: md corpus clean even at jaccard 0.5 (the
  # twin Dart test files are block-level clones — duplication gate
  # territory, file-level similarity is not for them).
  similarity:
    enabled: true
    dirs: ['.']
    include: ['**/*.md']
    jaccard: 0.6
    containment: 0.9
    exclude: ['.git/**', '.dart_tool/**', 'build/**', 'coverage/**']
  broken_goldens:
    enabled: true
    dirs: [test]
  test_assertions:
    enabled: true
    exclude:
      - 'test/**'
  folder_structure:
    enabled: true
    config:
      lib/src: 3
      'lib/src/**': 30
  # Wave-1 bug-class gate: the copy-paste-edit family — duplicate
  # conditions/bodies in one chain, duplicate/absorbed boolean operands,
  # identical ternary branches, duplicate positional call arguments,
  # duplicate catch bodies. Warning severity: equivalence assumes
  # side-effect-free operands.
  identical_branches:
    enabled: true
    severity: warning
    # Deliberate same-expression arguments exist (one-line ranges,
    # idempotence asserts, degenerate golden rects); suppression is
    # per-site with a reason.
    ignorable: true
  # Wave-3 simple ban: every non-null assertion — postfix `!` and the
  # null-assert pattern (`case var x!`). The census is live: 150 legacy
  # bangs in 41 files at enablement (runner.dart 33, profile_command 10,
  # memory_command 8 lead). Warning severity is the roadmap's ratchet
  # posture for an existing codebase: freeze with `check --save-baseline`
  # and gate only new bangs, or burn down per file; flip to error once
  # the count hits zero. The null-safe forms (`?.`/`??`, null-check
  # pattern) carry the same intent without the crash.
  non_null_assertion:
    enabled: true
    severity: warning
