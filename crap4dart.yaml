# crap4dart self-configuration (dogfooding).
# This repository is a pure Dart package, so Flutter-specific gates
# (golden, accessibility, hardcoded_strings) are disabled.
sources: [lib, bin, test]

crap:
  enabled: true
  threshold: 8.0

coverage:
  lcov_path: coverage/lcov.info
  run_tests: false
  required: false
  branch_coverage: true

gates:
  loc:
    enabled: true
    max_lines: 800
    exclude:
      - '**.g.dart'
      - '**.freezed.dart'
      - '**.mocks.dart'
  test_coverage:
    enabled: true
    min_percent: 70.0
    per_file: false
  golden:
    enabled: false
  hardcoded_strings:
    enabled: false
  accessibility:
    enabled: false
  complexity:
    enabled: true
    max_complexity: 12
  # Wave-6 type-surface gates, split by concern: inline record types
  # must move to named typedefs, record fields must be named (no .$N),
  # and record arity is capped (bigger records become classes).
  # Warning severity; dogfooding cleanup accompanies the enablement.
  inline_record_types:
    enabled: true
    severity: warning
  record_named_fields:
    enabled: true
    severity: warning
  record_size:
    enabled: true
    severity: warning
    max_fields: 5
  method_size:
    enabled: true
    max_lines: 80
    max_params: 8
    # Dogfooding `entries`: config aggregate/flag classes legitimately
    # need more params than a method — GatesConfig aggregates 23 gate
    # configs (one param each) and SimilarityGateConfig carries the
    # flag triplet + 6 similarity-specific keys.
    entries:
      - max_params: 24
        paths:
          - 'lib/src/config/config.dart'
          - 'lib/src/config/similarity_gate_config.dart'
  public_docs:
    enabled: true
    exclude:
      - 'test/**'
  # File-level near-duplicate detection (crap4dart >=0.15.0): docs
  # corpora rot through copy-paste; this catches new near-copies.
  # Measured on this repo: md corpus clean even at jaccard 0.5 (the
  # twin Dart test files are block-level clones — duplication gate
  # territory, file-level similarity is not for them).
  similarity:
    enabled: true
    dirs: ['.']
    include: ['**/*.md']
    jaccard: 0.6
    containment: 0.9
    exclude: ['.git/**', '.dart_tool/**', 'build/**', 'coverage/**']
  broken_goldens:
    enabled: true
    dirs: [test]
  test_assertions:
    enabled: true
    exclude:
      - 'test/**'
  folder_structure:
    enabled: true
    config:
      lib/src: 3
      'lib/src/**': 45
